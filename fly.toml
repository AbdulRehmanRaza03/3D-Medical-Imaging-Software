# Fly.io configuration for the OrthoVision AI backend.
#
# Deploy:
#   fly launch          # first time (auto-detects this file)
#   fly deploy           # subsequent deploys
#
# Recommended: attach a persistent volume for storage, or switch to the S3
# backend (STORAGE_BACKEND=s3) for a fully stateless deploy.

app = "orthovision-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  STORAGE_DIR = "/data/storage"
  JOB_BACKEND = "local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# Persistent volume for deployed artifacts (create with: fly volumes create data).
[mounts]
  source = "data"
  destination = "/data/storage"

# Set secrets on the machine (do NOT commit real values):
#   fly secrets set DATABASE_URL=postgresql://...
#   fly secrets set CORS_ORIGINS=https://your-app.vercel.app
#
# For Redis queue (production), set:
#   fly secrets set JOB_BACKEND=redis REDIS_URL=redis://...
#   then run a separate worker machine (dockerfile = Dockerfile.worker).
#
# For S3 storage:
#   fly secrets set STORAGE_BACKEND=s3 S3_BUCKET_NAME=... S3_ENDPOINT_URL=... S3_REGION=... S3_ACCESS_KEY=... S3_SECRET_KEY=...
